# Supply-chain hardening. These equal pnpm 11's defaults, but are spelled out so they
# stay on whatever pnpm version runs the install, and so changes show up in review.
minimumReleaseAge: 1440
blockExoticSubdeps: true

# Dependency install scripts are denied unless explicitly allowed here. None of these
# are needed: Firebase App Hosting auto-config, a version warning, and a native regex
# engine that only the Hosting emulator uses (it falls back without it).
allowBuilds:
  "@firebase/util": false
  protobufjs: false
  re2: false
  sharp: false
  unrs-resolver: false
